substitutions:
  name: "sprinkler-node-wifi"
  friendly_name: "Sprinkler Controller Wi-Fi"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev
  framework:
    type: esp-idf

# Enable Home Assistant API & OTA
api:
  encryption:
    key: "!secret api_encryption_key"

ota:
  - platform: esphome

wifi:
  ssid: "!secret wifi_ssid"
  password: "!secret wifi_password"
  ap:
    ssid: "Sprinkler-Fallback-AP"

logger:

# Bluetooth Tracker for Soil Moisture Probes (e.g., Xiaomi Mi Flora)
esp32_ble_tracker:

# Hardware Fail-safe Relays with automatic shutoff timers
switch:
  - platform: gpio
    pin: GPIO23
    name: "Zone 1 Front Lawn"
    id: zone_1
    restore_mode: ALWAYS_OFF
    interlock: [zone_1, zone_2, zone_3, zone_4]
    on_turn_on:
      - delay: 30min
      - switch.turn_off: zone_1 # Edge fail-safe auto shutoff

  - platform: gpio
    pin: GPIO22
    name: "Zone 2 Back Lawn"
    id: zone_2
    restore_mode: ALWAYS_OFF
    interlock: [zone_1, zone_2, zone_3, zone_4]
    on_turn_on:
      - delay: 30min
      - switch.turn_off: zone_2

  - platform: gpio
    pin: GPIO21
    name: "Zone 3 Garden Beds"
    id: zone_3
    restore_mode: ALWAYS_OFF
    interlock: [zone_1, zone_2, zone_3, zone_4]
    on_turn_on:
      - delay: 30min
      - switch.turn_off: zone_3

  - platform: gpio
    pin: GPIO19
    name: "Zone 4 Shrubs"
    id: zone_4
    restore_mode: ALWAYS_OFF
    interlock: [zone_1, zone_2, zone_3, zone_4]
    on_turn_on:
      - delay: 30min
      - switch.turn_off: zone_4

# Flow Meter Pulse Counter (Hall Effect or Reed Switch)
sensor:
  - platform: pulse_counter
    pin:
      number: GPIO18
      mode:
        input: true
        pullup: true
    name: "Water Flow Rate"
    id: water_flow_rate
    unit_of_measurement: "GPM"
    update_interval: 10s
    filters:
      - multiply: 0.132 # Calibrate per pulse meter specification

# Digital Rain Sensor Input (Normally Closed)
binary_sensor:
  - platform: gpio
    pin:
      number: GPIO17
      mode:
        input: true
        pullup: true
      inverted: true
    name: "Rain Sensor Tripped"
    id: rain_sensor_tripped
